# PostgreSQL cho môi trường phát triển: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner_dev
    ports:
      - "5432:5432"
    volumes:
      - planner-data:/var/lib/postgresql/data
volumes:
  planner-data:
